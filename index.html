<body>

  <h1>Voxel Builders</h1>

<script type="module">
/* ═══ VOXEL BUILDERS · a Multiplayer Agent starter ═══════════════════════════════════
 * Build a block world together. Co-op, 1–16 players; bots build beside you.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ island size, speeds, bots, block colors
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   WORLD MEMORY .. how the world survives the room emptying (same code in every starter)
 *   BLOCKS ........ how blocks are packed into shared fields, and what everyone sees
 *   WORLD (HOST) .. checking place/break, writing the blocks, bots and their blueprints
 *   SCENE ......... island, block mesh, effects, the builders' bodies
 *   ME ............ walking, jumping, aiming, placing and breaking
 *   HUD ........... status line, hotbar, hints, the start card
 *   INPUT ......... keyboard, mouse (pointer lock), touch stick and buttons
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one JSON field: position, facing) about 10
 *     times a second, `hb` (heartbeat) once a second, and `n`/`s` (name, body color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last
 *     3s), worked out every frame. Only the host writes the shared fields: `r0`…`r8`
 *     (the blocks, one field per 16×16 region, 3 characters per block), `rev` (how many
 *     changes people have made) and `bots`. A new host adopts all of it from state.
 *   - Everyone else sends intents: "place" {x, y, z, c} and "break" {x, y, z}. The host
 *     checks them and writes the region. Your own block shows at once (a "pending" copy)
 *     until the host's write comes back.
 *   - The world outlives the room through WORLD MEMORY (see that section).
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  size: 48,             // the island is size × size blocks (a multiple of `region`)
  height: 16,           // blocks stack this high. height × region × region must stay ≤ 4096
  region: 16,           // blocks are stored per region × region columns, one shared field each
  regionCap: 640,       // most blocks in one region (3 characters each, under the 2048 limit)
  reach: 7,             // how far away you can place and break, in blocks
  walk: 5.2,            // walking speed, blocks per second
  jump: 8.6,            // jump speed
  gravity: 26,
  look: 0.0024,         // mouse look, radians per pixel
  touchLook: 0.0065,    // touch drag look, radians per pixel
  seats: 4,             // bots fill the island up to this many builders
  botBuildMs: 320,      // ms between a bot's blocks
  botBlockLimit: 1800,  // bots stop starting new builds once the world has this many blocks
  saveNs: "voxel-world",// player-save namespace for world memory
  saveEvery: 10000,     // ms between world-memory saves
  attractSeed: 21,       // which village the ?attract preview builds
};
// Block colors, by index (0 is air). Index = the hotbar key.
const COLORS = [null, "#62c443", "#2f8f45", "#a36b3c", "#9ca6b0", "#d9553f", "#f4cf4a", "#3f8fe0", "#f5f3ee"];
const [, GRASS, LEAF, WOOD, STONE, BRICK, GOLD, BLUE, SNOW] = COLORS.map((_, i) => i);
const SKINS = ["#ff5a5f", "#3fa7ff", "#ffc93c", "#5ad15a", "#b57bff", "#ff8a3d", "#ff6fb5", "#36d6c6"];
const BOT_NAMES = ["Pip", "Bramble", "Cobble", "Maple", "Rusty", "Juniper", "Flint", "Clover"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'voxel-builders',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fallback) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fallback); memo.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
let player = null; // MP.auth client for world-memory saves (null offline)
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let frameAt = 0, wokeAt = -1e9; // my loop's last frame, and when it last woke from a stall (a frozen or background tab)
/** Never while my own loop is stalled, nor for 0.7s after it wakes: the room moved on without me, so the newer state lands first. */
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() - frameAt < 1000 && performance.now() - wokeAt > 700;

// ── WORLD MEMORY ────────────────────────────────────────────────────────────────────
// A relay room forgets everything when its last player leaves, so the PLAYERS remember the world:
//   1. Every CONFIG.saveEvery ms and when the page closes, each player saves a copy of the live
//      world with its `rev` (how many changes PEOPLE made; bots don't count, so a fresh world
//      full of bot builds never beats a saved one) to its player save (player.data, namespace
//      CONFIG.saveNs) and to this browser (localStorage). A copy with a higher rev than the live
//      world is never overwritten: it is kept and offered.
//   2. The first player into an empty room becomes host and loads its copy into shared.
//   3. A player who joins holding a copy with a HIGHER rev than the live world offers it: it
//      writes the copy into its own entity (`wmh` header, `wm0`, `wm1`… chunks under 2048
//      characters) and the host adopts it. The copy with more building in it wins; changes
//      made only in the other copy are lost.
// The game supplies worldSnapshot(), liveRev() (-1 = no world yet) and loadWorld(world, rev).
const memory = { saved: null, ready: false, cloud: null, lastJson: "", lastSave: 0, offerRev: 0, offerN: 0 };
const memoryKey = () => "mpa-world:" + MP_CONNECT.room + (net.offline ? ":offline" : "");

/** Read my copy: this browser's and my cloud save, whichever has the higher rev. */
async function loadMemory() {
  let best = null;
  try { best = JSON.parse(localStorage.getItem(memoryKey()) || "null"); } catch {}
  if (player) {
    try {
      const doc = (await player.data.get(CONFIG.saveNs)).data;
      if (doc && doc.room === MP_CONNECT.room && doc.world && (!best || doc.rev > best.rev)) best = doc;
      memory.cloud = true;
    } catch (e) { memory.cloud = false; console.warn("World memory: no cloud save, this browser only:", e && e.message); }
  }
  memory.saved = best && best.room === MP_CONNECT.room && best.world && typeof best.rev === "number" ? best : null;
  memory.lastJson = memory.saved ? JSON.stringify(memory.saved.world) : "";
  memory.ready = true;
}

/** Save my copy of the live world, unless it is unchanged or older than the copy I hold. */
function rememberWorld() {
  if (ATTRACT || !memory.ready) return;
  const rev = liveRev();
  if (rev < 0 || (memory.saved && rev < memory.saved.rev)) return; // mine is newer: keep it, keep offering it
  const doc = { room: MP_CONNECT.room, rev, at: Date.now(), world: worldSnapshot() };
  const json = JSON.stringify(doc.world);
  if (json === memory.lastJson) return;
  memory.lastJson = json; memory.saved = doc;
  try { localStorage.setItem(memoryKey(), JSON.stringify(doc)); } catch {}
  if (player && memory.cloud) {
    player.data.set(doc, { namespace: CONFIG.saveNs })
      .catch((e) => e && e.current ? player.data.set(doc, { namespace: CONFIG.saveNs, version: e.current.version }) : Promise.reject(e))
      .catch((e) => { if (e && (e.status === 401 || e.status === 403)) memory.cloud = false; });
  }
  const tag = document.getElementById("saved");
  if (tag) { tag.classList.add("on"); setTimeout(() => tag.classList.remove("on"), 1600); }
}

/** Once a second: offer my copy if it beats the live world (the host simply loads it). */
function offerMemory() {
  if (ATTRACT || !memory.ready) return;
  const mine = memory.saved, live = liveRev(), better = mine && mine.rev > live;
  if (isHost()) {
    if (memory.offerRev) clearOffer();
    if (better && live >= 0 && loadWorld(mine.world, mine.rev)) memoryAdopted("");
    return;
  }
  if (better && memory.offerRev !== mine.rev) {
    const json = JSON.stringify(mine.world), fields = {}, n = Math.ceil(json.length / 1900);
    if (n > 40) return; // too big for my entity: keep it for when I am host
    for (let i = 0; i < n; i++) fields["wm" + i] = "~" + json.slice(i * 1900, (i + 1) * 1900); // "~" keeps it a string
    net.me.set(fields);
    net.me.set("wmh", JSON.stringify({ room: MP_CONNECT.room, rev: mine.rev, n })); // header last: chunks land first
    memory.offerRev = mine.rev; memory.offerN = n;
  } else if (!better && memory.offerRev) clearOffer();
}
function clearOffer() {
  const fields = { wmh: "" };
  for (let i = 0; i < memory.offerN; i++) fields["wm" + i] = "";
  net.me.set(fields); memory.offerRev = 0; memory.offerN = 0;
}

/** Host, once a second: adopt the best complete offer that beats the live world. */
function adoptOffers() {
  let best = null;
  for (const id of livePlayers()) {
    const p = S.entities.players[id], h = id !== net.sessionId && parse(p && p.wmh, null);
    if (!h || h.room !== MP_CONNECT.room || !(h.n <= 40) || !(h.rev > liveRev()) || (best && h.rev <= best.rev)) continue;
    let json = "";
    for (let i = 0; i < h.n && json !== null; i++) { const c = p["wm" + i]; json = typeof c === "string" && c[0] === "~" ? json + c.slice(1) : null; }
    const world = parse(json, null);
    if (world) best = { rev: h.rev, world, name: p.n || "A player" };
  }
  if (best && loadWorld(best.world, best.rev)) memoryAdopted(best.name);
}
function memoryAdopted(name) {
  const text = name ? `${name} brought back the world they saved` : "Welcome back: your saved world is loaded";
  toast(text); net.send("memory", { text: name ? text : "The host brought back the world they saved" });
}
function memoryTick() {
  offerMemory();
  if (isHost() && !ATTRACT) adoptOffers();
  if (performance.now() - memory.lastSave > CONFIG.saveEvery) { memory.lastSave = performance.now(); rememberWorld(); }
}
addEventListener("pagehide", () => rememberWorld());
document.addEventListener("visibilitychange", () => { if (document.hidden) rememberWorld(); });

// ── BLOCKS ──────────────────────────────────────────────────────────────────────────
// A block is a cell (x, y, z) with a color index. Region field "r<i>" holds its blocks as
// "~" + 3 characters each: two for the spot inside the region, one for the color.
const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
const RG = CONFIG.region, RN = CONFIG.size / RG, REGIONS = RN * RN, MID = CONFIG.size / 2;
const key = (x, y, z) => (y << 12) | (z << 6) | x;           // x, z < 64
const kx = (k) => k & 63, ky = (k) => k >> 12, kz = (k) => (k >> 6) & 63;
const regionOf = (x, z) => Math.floor(z / RG) * RN + Math.floor(x / RG);
const inBounds = (x, y, z) => x >= 0 && z >= 0 && x < CONFIG.size && z < CONFIG.size && y >= 0 && y < CONFIG.height;

function encodeRegion(map) {
  let s = "~";
  for (const [k, c] of map) { const n = (ky(k) * RG + kz(k) % RG) * RG + kx(k) % RG; s += B64[n >> 6] + B64[n & 63] + B64[c]; }
  return s;
}
function decodeRegion(raw, ri) {
  const out = new Map(), x0 = (ri % RN) * RG, z0 = Math.floor(ri / RN) * RG;
  if (typeof raw !== "string" || raw[0] !== "~") return out;
  for (let i = 1; i + 3 <= raw.length && out.size < CONFIG.regionCap; i += 3) {
    const a = B64.indexOf(raw[i]), b = B64.indexOf(raw[i + 1]), c = B64.indexOf(raw[i + 2]), n = a * 64 + b;
    if (a < 0 || b < 0 || c < 1 || c >= COLORS.length) continue;
    const y = Math.floor(n / (RG * RG));
    if (y < CONFIG.height) out.set(key(x0 + (n % RG), y, z0 + Math.floor(n / RG) % RG), c);
  }
  return out;
}

// What everyone draws: the regions from state plus my own pending edits.
const view = { raw: [], maps: [], cells: new Map(), dirty: true };
const pending = new Map(); // key -> { c (0 = broken), until }
const pops = new Map();    // key -> time a block appeared (grow-in animation)
const sharedColor = (k) => { const m = view.maps[regionOf(kx(k), kz(k))]; return m && m.get(k); };
function syncView(now) {
  for (let ri = 0; ri < REGIONS; ri++) {
    const raw = S.shared["r" + ri];
    if (raw === view.raw[ri]) continue;
    const old = view.maps[ri], next = decodeRegion(raw, ri);
    if (old) { // what changed: new blocks grow in, removed ones burst
      let bursts = 0;
      for (const k of next.keys()) if (!old.has(k) && !pending.has(k)) pops.set(k, now);
      for (const [k, c] of old) if (!next.has(k) && !pending.has(k) && bursts++ < 30) burst(k, c);
    }
    view.raw[ri] = raw; view.maps[ri] = next; view.dirty = true;
  }
  for (const [k, p] of pending) if ((p.c ? sharedColor(k) === p.c : sharedColor(k) === undefined) || now > p.until) { pending.delete(k); view.dirty = true; }
  if (view.dirty) { view.dirty = false; rebuildBlocks(); }
}

// ── WORLD (HOST) ────────────────────────────────────────────────────────────────────
const world = { regions: [], rev: 0, adopted: false, dirty: new Set(), revDirty: false, bots: new Map(), lastFlush: 0, lastBots: 0, botsJson: "" };
const hostHas = (k) => world.regions[regionOf(kx(k), kz(k))].has(k);
const totalBlocks = () => world.regions.reduce((n, m) => n + m.size, 0);
const rand = ATTRACT ? mulberry32(CONFIG.attractSeed) : Math.random; // the preview builds the same village every time
const rnd = (a, b) => a + rand() * (b - a);
let startedAt = 0;

/** Become host: take the world exactly as state has it. */
function adoptWorld() {
  world.regions = Array.from({ length: REGIONS }, (_, ri) => decodeRegion(S.shared["r" + ri], ri));
  world.rev = Number(S.shared.rev) || 0; world.dirty.clear(); world.adopted = true;
  world.bots.clear();
  for (const b of shared("bots", [])) world.bots.set(b.i, { id: b.i, name: b.n, skin: b.s, x: b.x, y: b.y, z: b.z, r: b.r, plan: null, target: null, nextAt: 0, nextBlock: 0 });
}
/** World memory: install a saved world (checked block by block). */
function loadWorld(snap, rev) {
  if (!snap || !Array.isArray(snap.r) || snap.r.length !== REGIONS || typeof rev !== "number") return false;
  world.regions = snap.r.map((raw, ri) => decodeRegion(raw, ri));
  world.rev = rev; world.adopted = true; world.revDirty = true;
  for (let ri = 0; ri < REGIONS; ri++) world.dirty.add(ri);
  for (const b of world.bots.values()) { b.plan = null; b.target = null; }
  return true;
}
function worldSnapshot() {
  return { r: Array.from({ length: REGIONS }, (_, ri) => isHost() && world.adopted ? encodeRegion(world.regions[ri]) : typeof S.shared["r" + ri] === "string" ? S.shared["r" + ri] : "~") };
}
function liveRev() { return isHost() && world.adopted ? world.rev : typeof S.shared.rev === "number" ? S.shared.rev : -1; }

/** A fresh island: a few trees, the same in every new room. */
function defaultWorld() {
  world.regions = Array.from({ length: REGIONS }, () => new Map());
  world.rev = 0; world.adopted = true; world.revDirty = true;
  for (let ri = 0; ri < REGIONS; ri++) world.dirty.add(ri);
  const seeded = mulberry32(11);
  for (const [x, z] of [[8, 9], [38, 7], [40, 37], [6, 40], [30, 20], [14, 26]]) BLUEPRINTS.tree(x, z, seeded).forEach(placeCell);
  if (ATTRACT) for (let i = 0; i < 7; i++) { const site = findSite(); if (site) site.cells.forEach(placeCell); }
}
const placeCell = ([x, y, z, c]) => applyPlace("bot", { x, y, z, c }, false);
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/** A "place" intent (or a bot's block). `human` changes count toward rev. */
function applyPlace(from, m, human) {

  me.x = MID + rnd(-3, 3); me.z = MID + 12 + rnd(-2, 2); me.yaw = 0; me.pitch = -0.3; me.vy = 0;
  me.y = columnTop(Math.floor(me.x), Math.floor(me.z), (k) => view.cells.has(k));
}
function moveMe(dt) {
  const k = input.keys, playing = !card.hidden ? 0 : 1;
  let f = ((k.has("KeyW") || k.has("ArrowUp") ? 1 : 0) - (k.has("KeyS") || k.has("ArrowDown") ? 1 : 0) - input.stick.y) * playing;
  let s = ((k.has("KeyD") || k.has("ArrowRight") ? 1 : 0) - (k.has("KeyA") || k.has("ArrowLeft") ? 1 : 0) + input.stick.x) * playing;
  const len = Math.hypot(f, s); if (len > 1) { f /= len; s /= len; }
  const sin = Math.sin(me.yaw), cos = Math.cos(me.yaw);

  me.vy = Math.max(-30, me.vy - CONFIG.gravity * dt);
  const steps = Math.max(1, Math.ceil(Math.max(Math.abs(vx), Math.abs(vz), Math.abs(me.vy)) * dt / 0.4));
  for (let i = 0, h = dt / steps; i < steps; i++) {
    let blocked = false;
    if (!bodyHits(me.x + vx * h, me.y, me.z)) me.x += vx * h; else blocked = true;
    if (!bodyHits(me.x, me.y, me.z + vz * h)) me.z += vz * h; else blocked = true;

    if (blocked && me.onGround && !bodyHits(me.x + vx * 0.08, me.y + 1.05, me.z + vz * 0.08)) me.vy = CONFIG.jump; // step up a block on its own
  }

}
/** The block under the crosshair (a grid walk along the view ray), and where a new one would go. */
function aim() {
  const o = camera.position, d = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  for (const a of ["x", "y", "z"]) if (Math.abs(d[a]) < 1e-9) d[a] = 1e-9;
  let x = Math.floor(o.x), y = Math.floor(o.y), z = Math.floor(o.z), prev = null;
  const step = [Math.sign(d.x), Math.sign(d.y), Math.sign(d.z)], delta = [Math.abs(1 / d.x), Math.abs(1 / d.y), Math.abs(1 / d.z)];
  const next = [d.x > 0 ? x + 1 - o.x : o.x - x, d.y > 0 ? y + 1 - o.y : o.y - y, d.z > 0 ? z + 1 - o.z : o.z - z].map((v, i) => v * delta[i]);
  for (let t = 0; t <= CONFIG.reach;) {
    const inside = x >= 0 && z >= 0 && x < CONFIG.size && z < CONFIG.size;
    if (inside && (y < 0 || view.cells.has(key(x, y, z)))) return { cell: [x, y, z], ground: y < 0, place: prev };
    prev = [x, y, z];
    const a = next[0] < next[1] ? (next[0] < next[2] ? 0 : 2) : (next[1] < next[2] ? 1 : 2);
    t = next[a]; next[a] += delta[a];
    if (a === 0) x += step[0]; else if (a === 1) y += step[1]; else z += step[2];
  }

}
const overlapsMe = ([x, y, z]) => x + 1 > me.x - 0.3 && x < me.x + 0.3 && z + 1 > me.z - 0.3 && z < me.z + 0.3 && y + 1 > me.y && y < me.y + 1.75;
function act(place) {
  const hit = me.aim;
  if (!hit || ATTRACT) return;
  const c = place ? hit.place : hit.cell;
  if (!c || !inBounds(...c) || (place && overlapsMe(c))) return;
  const k = key(...c), msg = { x: c[0], y: c[1], z: c[2] };
  if (place) {
    if (view.cells.has(k)) return;
    const reg = view.maps[regionOf(c[0], c[2])];
    if (reg && reg.size >= CONFIG.regionCap) { toast("This part of the island is full"); return; }
    msg.c = me.color; pending.set(k, { c: me.color, until: performance.now() + 2500 }); pops.set(k, performance.now()); sfx(520, 0.07);
    if (isHost()) applyPlace(net.sessionId, msg, true); else net.send("place", msg);
  } else {
    if (hit.ground) return;
    burst(k, view.cells.get(k)); pending.set(k, { c: 0, until: performance.now() + 2500 }); sfx(180, 0.12, "sawtooth");
    if (isHost()) applyBreak(net.sessionId, msg, true); else net.send("break", msg);

}
function publish(now) {
  if (now - me.lastSend < 100) return;
  const json = JSON.stringify({ x: +me.x.toFixed(2), y: +me.y.toFixed(2), z: +me.z.toFixed(2), r: +me.yaw.toFixed(2) });

}
let audio = null;
function sfx(freq, dur, type = "square") {
  try {
    audio = audio || new AudioContext();
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 0.55, t + dur);
    g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
  } catch {}
}

// ── HUD ─────────────────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const card = $("card");
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
document.body.classList.toggle("touch", touchUI);
document.body.classList.toggle("attract", ATTRACT);
$("keys").textContent = touchUI ? "Left stick to walk · drag to look · PLACE and BREAK · tap a color" : "WASD to walk · Space to jump · click to place · right-click to break · 1–8 or the wheel for colors · Esc to pause";
for (let c = 1; c < COLORS.length; c++) {
  const b = document.createElement("button"); b.innerHTML = `<i style="background:${COLORS[c]}"></i>`; b.dataset.c = c;
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); pickColor(c); });
  $("bar").append(b);
}
function pickColor(c) { me.color = c; for (const b of $("bar").children) b.classList.toggle("on", +b.dataset.c === c); }
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 3500); }
let dropped = false; // true while the connection is down: the HUD keeps showing "Reconnecting…"
function hud() {
  const n = livePlayers().length;
  $("net").textContent = ATTRACT ? "" : net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the world" : ""}`;
  $("who").textContent = memory.saved && memory.saved.rev > 0 ? `You have a saved copy of this world (${memory.saved.rev} changes).` : net.offline ? "" : `${n} builder${n === 1 ? "" : "s"} here now.`;
}
let started = false;
$("play").addEventListener("click", () => {
  card.hidden = true;
  if (!started) { started = true; const h = $("hint"); h.textContent = $("keys").textContent; h.classList.add("on"); setTimeout(() => h.classList.remove("on"), 7000); }
  if (!touchUI && !input.noLock) requestLock();
});

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const cv = renderer.domElement;
const input = { keys: new Set(), stick: { x: 0, y: 0, id: null }, look: { id: null, x: 0, y: 0 }, drag: null, jump: false, noLock: false, lockedOnce: false };
const locked = () => document.pointerLockElement === cv;
function turn(dx, dy, k) { me.yaw -= dx * k; me.pitch = Math.max(-1.5, Math.min(1.5, me.pitch - dy * k)); }
function requestLock() { try { const p = cv.requestPointerLock(); if (p && p.catch) p.catch(lockFailed); } catch { lockFailed(); } }
function lockFailed() { if (!input.lockedOnce) input.noLock = true; else card.hidden = false; } // no pointer lock here (an iframe): drag to look
document.addEventListener("pointerlockerror", lockFailed);
document.addEventListener("pointerlockchange", () => { if (locked()) input.lockedOnce = true; else if (started && !input.noLock) card.hidden = false; });
addEventListener("keydown", (e) => {
  input.keys.add(e.code);
  const n = Number(e.key); if (n >= 1 && n < COLORS.length) pickColor(n);
  if (e.code === "Space" || e.code.startsWith("Arrow")) e.preventDefault();
});
addEventListener("keyup", (e) => input.keys.delete(e.code));
addEventListener("blur", () => input.keys.clear());
addEventListener("wheel", (e) => { if (card.hidden) pickColor(((me.color - 1 + (e.deltaY > 0 ? 1 : -1) + 8) % 8) + 1); }, { passive: true });
document.addEventListener("mousemove", (e) => { if (locked()) turn(e.movementX, e.movementY, CONFIG.look); });
cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (!card.hidden) return;
  if (e.pointerType === "mouse") {
    if (locked()) act(e.button === 0);
    else if (input.noLock) input.drag = { x: e.clientX, y: e.clientY, moved: 0, button: e.button };
    else requestLock();
  } else if (input.look.id === null) { input.look = { id: e.pointerId, x: e.clientX, y: e.clientY }; try { cv.setPointerCapture(e.pointerId); } catch {} }
});
cv.addEventListener("pointermove", (e) => {
  if (e.pointerId === input.look.id) { turn(e.clientX - input.look.x, e.clientY - input.look.y, CONFIG.touchLook); input.look.x = e.clientX; input.look.y = e.clientY; }
  else if (input.drag && e.pointerType === "mouse") {
    const dx = e.clientX - input.drag.x, dy = e.clientY - input.drag.y;
    input.drag.moved += Math.abs(dx) + Math.abs(dy); input.drag.x = e.clientX; input.drag.y = e.clientY; turn(dx, dy, CONFIG.look * 1.5);
  }
});
cv.addEventListener("pointerup", (e) => {
  if (e.pointerId === input.look.id) input.look.id = null;
  if (input.drag && e.pointerType === "mouse") { if (input.drag.moved < 6) act(input.drag.button === 0); input.drag = null; }
});
cv.addEventListener("pointercancel", (e) => { if (e.pointerId === input.look.id) input.look.id = null; input.drag = null; });
const stick = $("stick"), knob = $("knob");
function moveStick(e) {
  const r = stick.getBoundingClientRect(), R = r.width / 2;
  let x = (e.clientX - r.left - R) / R, y = (e.clientY - r.top - R) / R; const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
  input.stick.x = x; input.stick.y = y; knob.style.transform = `translate(${x * R * 0.6}px, ${y * R * 0.6}px)`;
}
stick.addEventListener("pointerdown", (e) => { e.preventDefault(); input.stick.id = e.pointerId; try { stick.setPointerCapture(e.pointerId); } catch {} moveStick(e); });

$("bPlace").addEventListener("pointerdown", (e) => { e.preventDefault(); act(true); });
$("bBreak").addEventListener("pointerdown", (e) => { e.preventDefault(); act(false); });
$("bJump").addEventListener("pointerdown", (e) => { e.preventDefault(); input.jump = true; });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) $("bJump").addEventListener(ev, () => { input.jump = false; });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
const orbit = { x: MID, z: MID };
function frame(now) {
  requestAnimationFrame(frame);

  frameAt = t0;

  syncView(now);

    outline.visible = !!(me.aim && !me.aim.ground); ghost.visible = !!(me.aim && me.aim.place && !overlapsMe(me.aim.place));
    if (outline.visible) outline.position.set(me.aim.cell[0] + 0.5, me.aim.cell[1] + 0.5, me.aim.cell[2] + 0.5);
    if (ghost.visible) { ghost.position.set(me.aim.place[0] + 0.5, me.aim.place[1] + 0.5, me.aim.place[2] + 0.5); ghost.material.color.set(COLORS[me.color]); }
    publish(now);

}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("place", (m, from) => { if (isHost()) applyPlace(from, m, true); });
  net.on("break", (m, from) => { if (isHost()) applyBreak(from, m, true); });
  net.on("memory", (m) => { if (m && typeof m.text === "string") toast(m.text.slice(0, 80)); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") player = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl });
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.s), ...shared("bots", []).map((b) => b.s)]);
  mySkin = SKINS.find((c) => !taken.has(c)) || SKINS[Math.floor(Math.random() * SKINS.length)];
  net.me.set({ n: myName, s: mySkin, hb: Date.now() });
  pickColor(BRICK);
  startedAt = performance.now();
  if (ATTRACT) { memory.ready = true; CONFIG.seats = 6; CONFIG.botBuildMs = 110; card.hidden = true; }
  else loadMemory();
  spawnMe();
  setInterval(memoryTick, 1000);
  requestAnimationFrame(frame);
})();
</script>
